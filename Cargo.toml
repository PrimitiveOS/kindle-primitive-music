[workspace]
resolver = "2"
members = ["crates/music-core", "crates/music-audio", "crates/music-render", "crates/music-kindle", "crates/music-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
music-core = { path = "crates/music-core" }
music-audio = { path = "crates/music-audio" }
music-render = { path = "crates/music-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
