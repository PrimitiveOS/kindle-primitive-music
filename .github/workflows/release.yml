name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    uses: PrimitiveOS/kindle-primitive-build/.github/workflows/package.yml@6235c4d7327fbcfce74fc68ec06ae3c4f9c4665d
    with:
      id: primitive-music
      dir: music
      binary-crate: music-kindle
      docs-licence-file: LICENSE-DOCS
      sibling-tools-ref: 3364de558b242aa2f435ea55b248c8b89f248957
